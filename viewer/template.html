<title>NAMMA TWIN</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: full-bleed 3D canvas; floating glass chrome (top bar, floor elevator, context panel, magnifying dock). */
:root{
  --bg:#0b0d10; --sky:#141a22;
  --panel:rgba(20,23,28,.66); --panel-solid:#14171c; --edge:rgba(255,255,255,.09); --edge-strong:rgba(255,255,255,.18);
  --fg:#eceff3; --fg-dim:#aab2bd; --muted:#7f8895;
  --brass:#e6b66f; --brass-ink:#241707; --route:#58b7ff; --ok:#5fd39a; --warn:#f2b84b; --bad:#ff7b72;
  --chip:rgba(255,255,255,.07); --chip-hover:rgba(255,255,255,.12);
  --shadow:0 18px 50px rgba(0,0,0,.45);
  --ui:'Figtree',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --r-panel:20px; --r-ctl:12px;
  color-scheme:dark;
}
@media (prefers-color-scheme: light){
  :root:not([data-theme="dark"]){
    --bg:#e7e4df; --sky:#cfd9e4;
    --panel:rgba(255,255,255,.72); --panel-solid:#fbfaf8; --edge:rgba(20,24,30,.1); --edge-strong:rgba(20,24,30,.2);
    --fg:#14181d; --fg-dim:#3b434d; --muted:#66707c;
    --brass:#8f5f14; --brass-ink:#fff7ea; --route:#0b6cc4; --ok:#117a4c; --warn:#946200; --bad:#c23a30;
    --chip:rgba(20,24,30,.06); --chip-hover:rgba(20,24,30,.11);
    --shadow:0 14px 40px rgba(40,30,20,.18);
    color-scheme:light;
  }
}
:root[data-theme="light"]{
  --bg:#e7e4df; --sky:#cfd9e4;
  --panel:rgba(255,255,255,.72); --panel-solid:#fbfaf8; --edge:rgba(20,24,30,.1); --edge-strong:rgba(20,24,30,.2);
  --fg:#14181d; --fg-dim:#3b434d; --muted:#66707c;
  --brass:#8f5f14; --brass-ink:#fff7ea; --route:#0b6cc4; --ok:#117a4c; --warn:#946200; --bad:#c23a30;
  --chip:rgba(20,24,30,.06); --chip-hover:rgba(20,24,30,.11);
  --shadow:0 14px 40px rgba(40,30,20,.18);
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0;overflow:hidden}
body{background:var(--bg);color:var(--fg);font:14px/1.45 var(--ui);-webkit-font-smoothing:antialiased;user-select:none;-webkit-user-select:none}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
:focus-visible{outline:2px solid var(--brass);outline-offset:2px;border-radius:8px}
#stage{position:fixed;inset:0;display:block;width:100%;height:100%;touch-action:none;cursor:grab;background:var(--sky)}
#stage.dragging{cursor:grabbing}
.glass{background:var(--panel);backdrop-filter:blur(22px) saturate(1.4);-webkit-backdrop-filter:blur(22px) saturate(1.4);border:1px solid var(--edge);box-shadow:var(--shadow)}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.dim{color:var(--fg-dim)} .muted{color:var(--muted)}

/* top bar */
#top{position:fixed;left:16px;right:16px;top:calc(12px + env(safe-area-inset-top,0px));display:flex;gap:12px;align-items:center;z-index:20;pointer-events:none}
#top>*{pointer-events:auto}
.brand{display:flex;align-items:center;gap:10px;padding:8px 14px 8px 10px;border-radius:999px}
.brand svg{width:26px;height:26px;flex:none}
.brand b{font-weight:700;letter-spacing:.14em;font-size:12.5px}
.scene{display:flex;align-items:center;gap:10px;padding:8px 14px;border-radius:999px;min-width:0}
.scene .nm{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.badge{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:3px 10px;font-size:11.5px;font-weight:600;background:color-mix(in srgb,var(--warn) 18%,transparent);color:var(--warn);border:1px solid color-mix(in srgb,var(--warn) 38%,transparent);white-space:nowrap}
.badge.ok{background:color-mix(in srgb,var(--ok) 16%,transparent);color:var(--ok);border-color:color-mix(in srgb,var(--ok) 36%,transparent)}
.badge.bad{background:color-mix(in srgb,var(--bad) 16%,transparent);color:var(--bad);border-color:color-mix(in srgb,var(--bad) 36%,transparent)}
.spacer{flex:1}
.search{position:relative;width:min(340px,40vw)}
.search input{width:100%;height:40px;border-radius:999px;border:1px solid var(--edge);background:var(--panel);backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);padding:0 16px 0 40px;outline:none;user-select:text;-webkit-user-select:text;box-shadow:var(--shadow)}
.search input::placeholder{color:var(--muted)}
.search input:focus{border-color:var(--brass)}
.search svg{position:absolute;left:14px;top:11px;width:18px;height:18px;color:var(--muted);pointer-events:none}
.results{position:absolute;top:46px;left:0;right:0;border-radius:16px;padding:6px;max-height:50vh;overflow:auto;display:none}
.results.open{display:block}
.res{display:flex;gap:10px;align-items:center;width:100%;text-align:left;padding:9px 10px;border-radius:10px}
.res:hover,.res[aria-selected="true"]{background:var(--chip-hover)}
.res .fl{margin-left:auto;font-size:12px;color:var(--muted)}
.ico-btn{width:40px;height:40px;border-radius:50%;display:grid;place-items:center}
.ico-btn:hover{background:var(--chip-hover)}
.ico-btn svg{width:19px;height:19px}

/* floor elevator + camera controls */
#elev{position:fixed;left:16px;top:50%;transform:translateY(-50%);z-index:15;display:flex;flex-direction:column;gap:6px;padding:8px;border-radius:22px}
#elev button{width:44px;height:44px;border-radius:14px;font-weight:700;font-size:15px;color:var(--fg-dim);display:grid;place-items:center;position:relative}
#elev button:hover{background:var(--chip-hover);color:var(--fg)}
#elev button[aria-pressed="true"]{background:var(--brass);color:var(--brass-ink)}
#elev small{display:block;text-align:center;font-size:10px;color:var(--muted);letter-spacing:.08em;margin:2px 0}
#camctl{position:fixed;left:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:15;display:flex;gap:4px;padding:6px;border-radius:999px}
.seg{display:flex;background:var(--chip);border-radius:999px;padding:3px;gap:2px}
.seg button{padding:7px 14px;border-radius:999px;font-weight:600;font-size:13px;color:var(--fg-dim)}
.seg button[aria-pressed="true"]{background:var(--fg);color:var(--bg)}
.seg button:hover:not([aria-pressed="true"]){color:var(--fg)}

/* right panel */
#panel{position:fixed;right:16px;top:calc(66px + env(safe-area-inset-top,0px));bottom:calc(104px + env(safe-area-inset-bottom,0px));width:372px;z-index:15;border-radius:var(--r-panel);display:flex;flex-direction:column;overflow:hidden;transition:transform .35s cubic-bezier(.2,.8,.2,1),opacity .25s}
#panel.closed{transform:translateX(calc(100% + 32px));opacity:0;pointer-events:none}
.ph{display:flex;align-items:center;gap:10px;padding:16px 18px 10px}
.ph h2{margin:0;font-size:18px;font-weight:700;letter-spacing:-.01em}
.ph .x{margin-left:auto}
.pb{overflow:auto;padding:4px 18px 18px;display:flex;flex-direction:column;gap:16px;flex:1;min-height:0;scrollbar-width:thin}
.sec{display:flex;flex-direction:column;gap:10px}
.sec>h3{margin:0;font-size:12px;font-weight:600;color:var(--muted);letter-spacing:.04em}
.row{display:flex;align-items:center;gap:10px;min-width:0}
.row .grow{flex:1;min-width:0}
.card{border:1px solid var(--edge);border-radius:14px;padding:12px 14px;background:var(--chip)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;font-size:13px}
.kv dt{color:var(--muted)} .kv dd{margin:0;text-align:right;min-width:0;overflow-wrap:anywhere}
.btn{height:38px;padding:0 16px;border-radius:var(--r-ctl);background:var(--chip);font-weight:600;font-size:13px;display:inline-flex;align-items:center;gap:8px;justify-content:center;border:1px solid var(--edge)}
.btn:hover{background:var(--chip-hover)}
.btn.primary{background:var(--brass);color:var(--brass-ink);border-color:transparent}
.btn.primary:hover{filter:brightness(1.07)}
.btn.route{background:var(--route);color:#04121f;border-color:transparent}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{padding:6px 12px;border-radius:999px;background:var(--chip);font-size:12.5px;font-weight:600;color:var(--fg-dim);border:1px solid transparent}
.chip:hover{background:var(--chip-hover)}
.chip[aria-pressed="true"]{background:color-mix(in srgb,var(--brass) 22%,transparent);color:var(--brass);border-color:color-mix(in srgb,var(--brass) 45%,transparent)}
.chip.off{opacity:.5}
.tog{display:flex;align-items:center;gap:12px;padding:7px 0;width:100%;text-align:left}
.tog .sw{width:38px;height:22px;border-radius:999px;background:var(--chip-hover);position:relative;flex:none;transition:background .2s;border:1px solid var(--edge)}
.tog .sw::after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:var(--fg-dim);transition:transform .2s,background .2s}
.tog[aria-checked="true"] .sw{background:var(--brass);border-color:transparent}
.tog[aria-checked="true"] .sw::after{transform:translateX(16px);background:var(--brass-ink)}
.tog .lb{flex:1;min-width:0} .tog .lb small{display:block;color:var(--muted);font-size:12px}
.tog[disabled]{opacity:.5;cursor:not-allowed}
input[type=range]{width:100%;accent-color:var(--brass);height:22px;margin:0}
.lab{display:flex;justify-content:space-between;font-size:12.5px;color:var(--fg-dim)}
.list{display:flex;flex-direction:column;gap:2px}
.item{display:flex;gap:10px;align-items:center;padding:9px 10px;border-radius:10px;text-align:left;width:100%;min-width:0}
.item:hover{background:var(--chip-hover)}
.item[aria-pressed="true"]{background:color-mix(in srgb,var(--brass) 16%,transparent)}
.dot{width:9px;height:9px;border-radius:50%;flex:none;background:var(--brass)}
.pill{font-size:11px;font-weight:600;padding:2px 8px;border-radius:999px;background:var(--chip-hover);color:var(--fg-dim);white-space:nowrap}
.bar{height:6px;border-radius:999px;background:var(--chip-hover);overflow:hidden;flex:1}
.bar>i{display:block;height:100%;background:var(--ok)}
.note{font-size:12.5px;color:var(--fg-dim);line-height:1.5}
.empty{padding:18px;text-align:center;color:var(--muted);font-size:13px}
.steps{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:2px}
.steps li{display:flex;gap:12px;padding:8px 4px;font-size:13px;align-items:flex-start}
.steps li i{flex:none;width:22px;height:22px;border-radius:50%;background:var(--route);color:#04121f;display:grid;place-items:center;font-size:11px;font-style:normal;font-weight:700}
.pip{position:relative;border-radius:12px;overflow:hidden;border:1px solid var(--edge);background:#000;aspect-ratio:16/9}
.pip img{width:100%;height:100%;object-fit:cover;display:block}
.pip .tag{position:absolute;left:8px;bottom:8px;font-size:11px;padding:3px 8px;border-radius:999px;background:rgba(0,0,0,.6);color:#fff}

/* dock (magnifying) */
#dockwrap{position:fixed;left:0;right:0;bottom:calc(14px + env(safe-area-inset-bottom,0px));display:flex;justify-content:center;z-index:25;pointer-events:none}
#dock{display:flex;align-items:flex-end;gap:8px;padding:9px 12px;border-radius:26px;pointer-events:auto;height:72px}
.dk{position:relative;width:52px;height:52px;border-radius:15px;display:grid;place-items:center;color:var(--fg);background:var(--chip);border:1px solid var(--edge);transform-origin:50% 100%;will-change:transform;transition:background .2s}
.dk svg{width:26px;height:26px}
.dk[aria-pressed="true"]{background:color-mix(in srgb,var(--brass) 28%,var(--chip))}
.dk[aria-pressed="true"]::after{content:"";position:absolute;bottom:-7px;width:5px;height:5px;border-radius:50%;background:var(--brass)}
.dk .tip{position:absolute;bottom:calc(100% + 12px);left:50%;transform:translateX(-50%);white-space:nowrap;padding:5px 10px;border-radius:9px;font-size:12px;font-weight:600;background:var(--panel-solid);border:1px solid var(--edge-strong);opacity:0;pointer-events:none;transition:opacity .15s}
.dk:hover .tip,.dk:focus-visible .tip{opacity:1}
.dksep{width:1px;align-self:center;height:34px;background:var(--edge-strong)}

/* in-scene labels */
#labels{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:5}
.lbl{position:absolute;left:0;top:0;transform:translate(-50%,-100%);pointer-events:auto;white-space:nowrap;font-size:12px;font-weight:600;padding:4px 9px 4px 8px;border-radius:999px;background:var(--panel-solid);border:1px solid var(--edge-strong);display:flex;align-items:center;gap:6px;box-shadow:0 6px 18px rgba(0,0,0,.3);cursor:pointer}
.lbl:hover,.lbl.sel{border-color:var(--brass);color:var(--brass)}
.lbl.room{background:transparent;border-color:transparent;box-shadow:none;color:#fff;text-shadow:0 1px 6px rgba(0,0,0,.8);font-weight:600;pointer-events:none}
#prompt{position:fixed;left:50%;bottom:calc(104px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:22;display:none;gap:8px}
#prompt.show{display:flex}
#hud{position:fixed;left:50%;top:calc(66px + env(safe-area-inset-top,0px));transform:translateX(-50%);z-index:12;padding:8px 16px;border-radius:999px;font-size:13px;font-weight:600;display:none;max-width:calc(100vw - 32px)}
#hud.show{display:block}
#toast{position:fixed;left:50%;top:calc(116px + env(safe-area-inset-top,0px));transform:translate(-50%,-8px);z-index:40;padding:9px 16px;border-radius:12px;opacity:0;pointer-events:none;transition:.25s;font-weight:600;font-size:13px}
#toast.show{opacity:1;transform:translate(-50%,0)}

/* loading */
#boot{position:fixed;inset:0;z-index:100;background:var(--bg);display:grid;place-items:center;transition:opacity .6s}
#boot.gone{opacity:0;pointer-events:none}
#boot .in{width:min(360px,calc(100vw - 48px));display:flex;flex-direction:column;gap:18px}
#boot .tr{height:3px;border-radius:3px;background:var(--chip-hover);overflow:hidden}
#boot .tr i{display:block;height:100%;width:0;background:var(--brass);transition:width .25s}
#boot .st{font-size:13px;color:var(--fg-dim)}
#fail{display:none;padding:18px;border-radius:14px;border:1px solid var(--bad);color:var(--fg)}

@media (max-width:760px){
  .scene .nm,.brand b{display:none}
  .scene{padding:8px 10px}
  .search{width:auto;flex:1}
  #panel{left:16px;right:16px;width:auto;top:auto;bottom:calc(98px + env(safe-area-inset-bottom,0px));max-height:46vh}
  #panel.closed{transform:translateY(calc(100% + 120px))}
  #elev{top:calc(120px + env(safe-area-inset-top,0px));transform:none}
  #camctl{bottom:calc(98px + env(safe-area-inset-bottom,0px));left:auto;right:16px}
  .dk{width:44px;height:44px;border-radius:13px} .dk svg{width:22px;height:22px}
  #dock{gap:5px;padding:8px;height:62px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<canvas id="stage" tabindex="0" aria-label="3D view of the demo building. Drag to orbit, scroll to zoom, right-drag to pan."></canvas>
<div id="labels" aria-hidden="true"></div>

<header id="top">
  <div class="brand glass" aria-label="NAMMA TWIN">
    <svg viewBox="0 0 32 32" fill="none" aria-hidden="true"><rect x="3" y="14" width="26" height="14" rx="2" stroke="currentColor" stroke-width="1.8" opacity=".5"/><rect x="3" y="8" width="26" height="6" rx="2" stroke="currentColor" stroke-width="1.8" opacity=".75" transform="translate(0 -1)"/><rect x="7" y="2" width="18" height="6" rx="2" fill="var(--brass)"/><circle cx="16" cy="21" r="2.4" fill="var(--route)"/></svg>
    <b>NAMMA TWIN</b>
  </div>
  <div class="scene glass">
    <span class="nm" id="sceneName">Demo Block A</span>
    <button class="badge" id="provBadge" aria-haspopup="dialog" title="What is real and what is simulated">Synthetic demo · simulated scan</button>
  </div>
  <div class="spacer"></div>
  <div class="search">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
    <input id="q" type="search" placeholder="Search rooms, labs, washrooms" autocomplete="off" aria-label="Search destinations" role="combobox" aria-expanded="false" aria-controls="results">
    <div class="results glass" id="results" role="listbox"></div>
  </div>
  <div class="glass" style="border-radius:999px;display:flex;padding:0 4px">
    <button class="ico-btn" id="btnTheme" aria-label="Switch light or dark theme" title="Theme"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg></button>
    <button class="ico-btn" id="btnFull" aria-label="Fullscreen" title="Fullscreen"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button>
  </div>
</header>

<nav id="elev" class="glass" aria-label="Floors"></nav>

<div id="camctl" class="glass">
  <div class="seg" role="group" aria-label="Camera mode">
    <button id="modeOrbit" aria-pressed="true">Orbit</button>
    <button id="modeWalk" aria-pressed="false">Walk</button>
  </div>
  <button class="ico-btn" id="btnReset" aria-label="Reset camera" title="Reset camera"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/></svg></button>
</div>

<aside id="panel" class="glass closed" aria-live="polite"></aside>
<div id="hud" class="glass"></div>
<div id="prompt"></div>
<div id="toast" class="glass" role="status"></div>

<div id="dockwrap"><div id="dock" class="glass" role="toolbar" aria-label="Workspaces"></div></div>

<div id="boot"><div class="in">
  <div style="display:flex;align-items:center;gap:12px"><b style="letter-spacing:.16em;font-size:14px">NAMMA TWIN</b><span class="muted" style="font-size:13px">Preparing the building</span></div>
  <div class="tr"><i id="bootBar"></i></div>
  <div class="st" id="bootMsg">Starting</div>
  <div id="fail" role="alert"></div>
</div></div>
